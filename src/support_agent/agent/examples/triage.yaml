      category: Kiosks
      asset_id: RTR-0017-01
      system_version: NetLink NL-3000 v2.2
      history: []
    facts: "flags none; asset RTR-0017-01 = Network Router; store has Network Router, POS Terminal, Receipt Printer (no kiosk)"
    lookups: []
    verdict:
      real_category: Other
      real_device: null
      trick_flags: [not_it, wrong_category, wrong_device]
      runbook_id: null
      runbook_evidence: null
      sop_triggers: []
      doc_conflicts: []
