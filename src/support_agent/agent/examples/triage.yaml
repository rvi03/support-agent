  - id: INC-00054
    case: wrong category (E8)
    ticket:
      subject: POS Terminal T1 Not Responding - Connection Lost
      description: POS terminal T1 stopped responding at approximately 15:00 IST during peak lunch service. The terminal displays 'Unable to connect to server' error and all transaction processing has halted. We have restarted the terminal twice but the issue persists. Upon investigation, we noticed that the router light indicator is off and there is no connectivity to other networked devices in the store either. The WiFi network is not broadcasting and all staff devices are also unable to connect to the internet.
      category: POS
      asset_id: POS-0053-T1
      system_version: FoodTech POS v4.2.2
      history:
        - "L1 Agent: Ticket received and reviewed. [...]"
    facts: "flags none; asset POS-0053-T1 = POS Terminal, FoodTech POS v4.2.2; store has Network Router, POS Terminal, Receipt Printer"
    lookups:
      - search_kb("router light off no connectivity all devices WiFi not broadcasting", network) -> runbooks/network-router-offline.md first
      - get_document("runbooks/network-router-offline.md") -> Symptoms lists no connectivity across all devices and router LEDs off
    verdict:
      real_category: Wi-Fi / Network
      real_device: Network Router
      trick_flags: [wrong_category, wrong_device, steps_already_tried]
      runbook_id: runbooks/network-router-offline.md
      runbook_evidence:
        section_id: runbooks/network-router-offline.md#symptoms
        quote: No internet connectivity across all wired and wireless devices
      sop_triggers:
        - trigger: network_failure
          evidence: the router light indicator is off and there is no connectivity to other networked devices in the store either
      doc_conflicts: []
      route: l2_now
      reason: Filed as a POS fault, but the router is dark and every device in the store has lost connectivity, so the real issue is the router (network failure); the POS is only a victim.
      confidence: 0.88
    why: The ticket field says POS, but the text shows a store-wide router outage, so category and device come from the content.

