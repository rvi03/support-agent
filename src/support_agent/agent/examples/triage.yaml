    facts: "flags unknown_system, version_mismatch; asset RTR-0037-01 = Network Router, NetLink NL-3000 v2.2; known bug for KitchenBridge v2.3: unknown_system; store has Network Router, POS Terminal, Receipt Printer"
    lookups: []
    verdict:
      real_category: Soft Serve
      real_device: Soft Serve Machine
      trick_flags: [unknown_system, wrong_device, steps_already_tried]
      runbook_id: null
      runbook_evidence: null
      sop_triggers: []
