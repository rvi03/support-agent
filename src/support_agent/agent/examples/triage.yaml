  - id: INC-00149
    case: too vague (clarify)
    ticket:
      subject: POS terminal not connecting
      description: The POS machine is not working. Network seems to be down or something. Can't process orders. Please fix ASAP.
      category: POS
      asset_id: POS-0120-T1
      system_version: OrbitPOS v2.1
      history: []
    facts: "flags none; asset POS-0120-T1 = POS Terminal, OrbitPOS v2.1; store has Network Router, POS Terminal, Receipt Printer, Self-Order Kiosk, Soft Serve Machine"
    lookups: []
    verdict:
      real_category: POS
      real_device: POS Terminal
      trick_flags: [too_vague]
      runbook_id: null
      runbook_evidence: null
      sop_triggers: []
      doc_conflicts: []
      route: clarify
      reason: No error, screen message or scope is given, so it is unclear whether one terminal or the whole network is down; one question (what the screen shows and whether other devices are online) makes it actionable.
      confidence: 0.75
    why: '"ASAP" is not a trigger, and guessing between a POS runbook and a router runbook would be a coin toss; one question settles it.'

  - id: INC-00237
    case: documents disagree (error code)
    ticket:
      subject: FrostyPro 800 displaying persistent Error Code E-407 on soft serve machine SSM-0023-01
      description: "The soft serve machine (FrostyPro 800 v2.0, asset ID SSM-0023-01) at ServeWell - Saket began displaying Error Code E-407 on its LED control panel at approximately 2:45 PM IST today (09-May-2026). The error message reads: 'E-407: Compressor Temperature Sensor Malfunction - Manual Reset Required.' The machine ceased dispensing product immediately upon error display [...] We have attempted the standard L1 troubleshooting steps: (1) power cycle by switching off the main breaker for 30 seconds and restarting; (2) checked all visible cable connections [...] Immediate escalation and on-site technical support is required to restore this asset to service."
      category: Soft Serve
      asset_id: SSM-0023-01
      system_version: FrostyPro 800 v2.0
      history:
        - "L1 Agent: Ticket received and reviewed. [...]"
    facts: "flags none; asset SSM-0023-01 = Soft Serve Machine, FrostyPro 800 v2.0, in warranty; no known bug"
    lookups:
      - search_kb("FrostyPro 800 error code E-407 compressor temperature sensor", soft_serve) -> runbooks/soft-serve-error-codes.md (FrostyPro table), system-specs/frostypro-soft-serve.md (F01-F08 table)
      - get_document("runbooks/soft-serve-error-codes.md") -> FrostyPro codes F01-F08 only; F02 = Evaporator Temperature Sensor Malfunction
      - get_document("system-specs/frostypro-soft-serve.md") -> F01-F08 only; F03 = Temperature sensor fault
    verdict:
      real_category: Soft Serve
      real_device: Soft Serve Machine
      trick_flags: [steps_already_tried]
      runbook_id: runbooks/soft-serve-error-codes.md
      runbook_evidence:
        section_id: runbooks/soft-serve-error-codes.md#symptoms
        quote: Machine displays alphanumeric error code on digital display panel
      sop_triggers:
        - trigger: error_not_in_kb
          evidence: began displaying Error Code E-407 on its LED control panel
        - trigger: customer_asks
          evidence: Immediate escalation and on-site technical support is required to restore this asset to service.
      doc_conflicts:
        - runbooks/soft-serve-error-codes.md and system-specs/frostypro-soft-serve.md disagree on which FrostyPro code is the temperature-sensor fault (runbook F02, spec F03); neither lists E-407.
      route: l2_now
      reason: E-407 is in no FrostyPro code table, the two tables disagree on the temperature-sensor code this fault depends on, the power cycle was already done, and the store asks for on-site support.
      confidence: 0.88
    why: Both documents were read and they disagree on the fact the diagnosis needs, so the conflict is named without picking a side, and the unlisted code is error_not_in_kb.
