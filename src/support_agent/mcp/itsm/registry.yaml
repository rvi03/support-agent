# Action registry (D37, rag-design.md 6.3). Plain data: itsm-actions loads it with
# registry.py; the S14 safety checker reads it with its own loader (D42).
# Its version is the file's hash, which goes into kb_rev, so any edit here
# makes the KB revision change and needs `make index`.
#
# S7 ships the schema and one test entry per tier; S9 adds the Group A entries.
# The agent chooses the action from this list (its tools); the server checks tier,
# autonomy and approval (S8a: no text patterns).
#   tier: read_only (autonomous) | reversible (supervised -> autonomous) | destructive (always supervised)
#   simulated_result: what the default outcome provider returns (eval uses fault cards, D40)
#   approver: optional; vendor -> vendor_approver, l2 -> l2_engineer (else l2)
actions:
  - action_id: check_printer_status
    description: Read the printer's status from the POS (online, paper, cover).
    device_families: [printer]
    tier: read_only
    simulated_result:
      outcome: no_change
      text: "Printer status read: online, paper present, cover closed."

  - action_id: restart_print_spooler
    description: Restart the Windows Print Spooler service on the POS terminal.
    device_families: [printer, pos]
    tier: reversible
    simulated_result:
      outcome: fixed
      text: "Print Spooler restarted; printer status online."

  - action_id: clear_print_queue
    description: Delete every pending job in the POS print queue.
    device_families: [printer]
    tier: destructive
    approver: l2
    simulated_result:
      outcome: fixed
      text: "Print queue cleared; 0 jobs pending."

  # ---- Group A entries (S11): the IT steps of the approved demo paths
  # (agent/bindings.yaml binds each one to its exact runbook span).
  - action_id: check_printer_recognition
    description: Read whether Windows lists the printer in Printers & Scanners, and its icon (green check, yellow warning or missing).
    device_families: [printer]
    tier: read_only
    simulated_result:
      outcome: no_change
      text: "Printer listed in Printers & Scanners with a green checkmark."

  - action_id: check_device_manager_status
    description: Read the printer's entry and any error code in Windows Device Manager.
    device_families: [printer]
    tier: read_only
    simulated_result:
      outcome: no_change
      text: "Device Manager lists the printer with no error code."

  - action_id: check_printer_driver_version
    description: Read the installed printer driver version on the POS terminal.
    device_families: [printer]
    tier: read_only
    simulated_result:
      outcome: no_change
      text: "Driver version is current (at or above the runbook's minimum)."

  - action_id: ping_network_printer
    description: Ping the network printer's IP address from the POS terminal.
    device_families: [printer]
    tier: read_only
    simulated_result:
      outcome: no_change
      text: "Printer replies to ping; it is reachable on the network."

  - action_id: check_pos_process_health
    description: Read the POS application's CPU and memory use and recent application errors on the terminal.
    device_families: [pos]
    tier: read_only
    simulated_result:
      outcome: no_change
      text: "POS process CPU 12%, memory 41%; no recent critical application errors."
