# Conflict register (rag-design.md section 9; D38). Source: assumptions.md A12-A16,
# A18-A21, A26, A29. A17 (overdue review) and A22 (NetLink v2.1 end of support) are
# facts, not conflicts between documents, so they have no row.
# resolution: flag_and_handoff (a ticket whose fix depends on it goes to L2 with both
# claims), or sop_wins (peak hours and SLA: the escalation SOP and sla_matrix decide).
# attach: per document, a regex; a section of that document whose text matches gets
# the conflict id. A new conflict is a new row (code change), as flag_and_handoff.
version: conflicts-v1
conflicts:
  - id: A12
    topic: Soft-serve error E-02 meaning
    resolution: flag_and_handoff
    affects: {device_family: soft_serve, codes: [E02]}
    claims:
      faq/soft-serve-faq.md: "E-02 is a temperature sensor malfunction on all three models"
      runbooks/soft-serve-error-codes.md: "E02 is Freezing Unit Temperature Out of Range (Too Warm); E-codes are CreamTech only"
    attach:
      faq/soft-serve-faq.md: '\bE-?02\b'
      runbooks/soft-serve-error-codes.md: '\bE-?02\b'
  - id: A13
    topic: Cisco SG350 is a switch or a router
    resolution: flag_and_handoff
    affects: {device_family: network, systems: [Cisco SG350]}
    claims:
      faq/network-faq.md: "Cisco SG350 is a managed switch"
      data/assets.csv: "Cisco SG350 is asset_type Network Router"
    attach:
      faq/network-faq.md: 'SG350'
  - id: A14
    topic: L2 response time
    resolution: sop_wins
    affects: {scope: escalation}
    claims:
      sop/escalation-procedure.md: "P1 15 min, P2 1 h, P3 3 h, P4 8 business hours"
      sop/shift-start-checklist.md: "15 minutes"
      sop/shift-end-checklist.md: "1 hour (business hours); next business day after hours"
    attach:
      sop/escalation-procedure.md: '(?i)response'
      sop/shift-start-checklist.md: '(?i)L2'
      sop/shift-end-checklist.md: '(?i)L2'
  - id: A15
    topic: On-Call Manager response time
    resolution: sop_wins
    affects: {scope: escalation}
    claims:
      sop/shift-start-checklist.md: "10 minutes"
      sop/shift-end-checklist.md: "15 minutes (critical incidents only)"
      sop/escalation-procedure.md: "24/7 for P1 escalations, no response time"
    attach:
      sop/shift-start-checklist.md: '(?i)on-call'
      sop/shift-end-checklist.md: '(?i)on-call'
      sop/escalation-procedure.md: '(?i)on-call'
  - id: A16
    topic: Two SLA tables
    resolution: sop_wins
    affects: {scope: sla}
    claims:
      sop/escalation-procedure.md: "L2 SLAs from escalation: resolve P1 4 h, P2 8 h, P3 24 h, P4 5 business days"
      data/sla_matrix.csv: "From date_opened: resolve P1 60 min, P2 240 min, P3 480 min, P4 1440 min"
    attach:
      sop/escalation-procedure.md: '(?i)\bSLA\b|resolution target'
  - id: A18
    topic: Soft-serve error code meanings (runbook table vs specs)
    resolution: flag_and_handoff
    affects: {device_family: soft_serve, codes: [E01-E12, F01-F08]}
    claims:
      runbooks/soft-serve-error-codes.md: "Error Code Table meanings (e.g. E01 Too Cold, E04 Hopper Low, F02 Evaporator Sensor)"
      system-specs/creamtech-soft-serve.md: "Spec meanings (e.g. E01 Compressor overheat, E04 Ambient temperature)"
      system-specs/frostypro-soft-serve.md: "Spec meanings (e.g. F02 Mix level critical)"
    attach:
      runbooks/soft-serve-error-codes.md: '\b[EF]-?\d{2}\b'
      system-specs/creamtech-soft-serve.md: '\bE-?\d{2}\b'
      system-specs/frostypro-soft-serve.md: '\bF-?\d{2}\b'
  - id: A19
    topic: FoodTech POS end-of-life dates
    resolution: flag_and_handoff
    affects: {device_family: pos, systems: [FoodTech POS]}
    claims:
      system-specs/foodtech-pos.md: "v4.2.1 and v4.2.2 EOL 2025-12-31, v4.2.3 2026-06-30, v5.1.x 2027-12-31"
      kb/system-specs/version-matrix.csv: "v4.2.1 EOL scheduled 2026-12"
      runbooks/pos-startup-failure.md: "v4.2.x end of support 2026-03-31"
    attach:
      system-specs/foodtech-pos.md: '(?i)end[- ]of[- ](?:life|support)|\bEOL\b'
      runbooks/pos-startup-failure.md: '(?i)end[- ]of[- ](?:life|support)|\bEOL\b'
