  - id: A21
    topic: Epson TM-T88VI driver version
    resolution: flag_and_handoff
    affects: {device_family: printer, systems: [Epson TM-T88VI]}
    claims:
      system-specs/epson-printer.md: "current Windows driver 2.12.7"
      runbooks/printer-offline.md: "driver v3.2.0 or later"
      runbooks/printer-driver-reinstall.md: "driver v1.12"
      runbooks/printer-wrong-output.md: "driver v6.xx up to v6.12a"
      runbooks/pos-printer-integration.md: "v4.02 as an example"
    attach:
      system-specs/epson-printer.md: '(?i)driver'
      runbooks/printer-offline.md: '(?i)driver[^\n]{0,40}v?\d+\.\d'
      runbooks/printer-driver-reinstall.md: '(?i)v?1\.12\b|driver version'
      runbooks/printer-wrong-output.md: '(?i)v?6\.\d'
      runbooks/pos-printer-integration.md: '(?i)v?4\.02'
