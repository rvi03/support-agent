# ServeWell support-agent local platform (S2). Run through `make up`, which
# renders .run/ files, applies db/sql/, creates buckets and checks the models.
# Rules: every image pinned to a version; every container has a healthcheck;
# each container gets only its own variables, never the whole .env (D46);
# host ports bind to 127.0.0.1 only. Ollama runs natively on the Mac.
name: servewell

x-langfuse-env: &langfuse-env
  # Listen on every interface so the in-container healthcheck can reach 127.0.0.1.
  HOSTNAME: 0.0.0.0
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3000
  SALT: ${LANGFUSE_SALT:?}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_AUTH: ${VALKEY_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY_LANGFUSE:?}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY_LANGFUSE:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY_LANGFUSE:?}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY_LANGFUSE:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:8333
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  postgres:
    build:
      context: ./postgres
    image: servewell-postgres:17.12-pgvector0.8.7-pgtextsearch1.5.1
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 1g}}}
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=128 -volume.max=50
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweed_data:/data
      - ../.run/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy: {resources: {limits: {memory: 512m}}}
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      # One issuer for host and containers; containers reach it by service name.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: servewell-admin
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ../.run/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # Healthy only once the realm import has finished, not just the server.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/servewell/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8080\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"issuer"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy: {resources: {limits: {memory: 1g}}}
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.22.4-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --disable-telemetry
      - --log-format=json
      - --set=decision_logs.console=true
      - /policies
    ports: ["127.0.0.1:8181:8181"]
    volumes:
      - ./opa/policies:/policies:ro
    healthcheck:
      # The static image has no shell or curl; OPA's own http.send does the probe.
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\": \"GET\", \"url\": \"http://127.0.0.1:8181/health\"}).status_code == 200"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: {resources: {limits: {memory: 256m}}}
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.11-alpine
    # S6: user `knowledge` may touch only `kb:*` keys (per-run budget, eval exclusions).
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --user knowledge on \">$$VALKEY_PASSWORD_KNOWLEDGE\" '~kb:*' +@all -@dangerous --maxmemory-policy noeviction --save '' --appendonly no"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      VALKEY_PASSWORD_KNOWLEDGE: ${VALKEY_PASSWORD_KNOWLEDGE:?}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 256m}}}
    restart: unless-stopped

  clickhouse:
    # The version Langfuse pins in its own v4 compose.
    image: clickhouse/clickhouse-server:26.3.62.3
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 1536m}}}
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:4.82.0
    environment:
      <<: *langfuse-env
    depends_on: &langfuse-deps
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      valkey: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy: {resources: {limits: {memory: 1g}}}
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:4.82.0
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://seaweedfs:8333
      # Headless setup: org, project, API keys and the local admin (no manual steps).
      LANGFUSE_INIT_ORG_ID: servewell
      LANGFUSE_INIT_ORG_NAME: ServeWell
      LANGFUSE_INIT_PROJECT_ID: support-agent
      LANGFUSE_INIT_PROJECT_NAME: support-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: admin@servewell.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: *langfuse-deps
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy: {resources: {limits: {memory: 1536m}}}
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.108.11
    # Logs go to stdout and to LOG_DIR/litellm.log for the K11 scan (S1, Codex F4).
    # The image has bash but no tee, so bash copies each line to both.
    entrypoint:
      - /usr/bin/bash
      - -c
      - >-
        exec > >(while IFS= read -r line; do printf '%s\n' "$$line"; printf '%s\n' "$$line" >> /logs/litellm.log; done) 2>&1;
        exec litellm "$$@"
      - litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is empty in .env}
      # Only for the Ollama fallback (D64).
      OLLAMA_API_BASE: http://host.docker.internal:11434
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000
      LANGFUSE_HOST: http://langfuse-web:3000
      LITELLM_LOG: INFO
      JSON_LOGS: "true"
      # Use the bundled model price list; never fetch it from GitHub at startup. With
      # telemetry off and no database, LiteLLM's only outside traffic is the OpenAI API.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ../logs:/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy: {resources: {limits: {memory: 1g}}}
    restart: unless-stopped

  it-data:
    # S5: read-only IT data MCP server (Streamable HTTP, OAuth resource server).
    build:
      context: ..
      dockerfile: compose/app/Dockerfile
    image: servewell-app:s6
    command: ["python", "-m", "support_agent.mcp.it_data"]
    environment:
      DATABASE_URL_IT_DATA: ${DATABASE_URL_IT_DATA:?}
      DB_HOST: postgres
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/servewell/protocol/openid-connect/certs
      OPA_URL: http://opa:8181
      LITELLM_BASE_URL: http://litellm:4000
      LOG_DIR: /logs
      IT_DATA_HOST: 0.0.0.0
      IT_DATA_PORT: "8101"
    ports: ["127.0.0.1:8101:8101"]
    volumes:
      - ../logs:/logs
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      opa: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: {resources: {limits: {memory: 256m}}}
    restart: unless-stopped


  knowledge:
    # S6: retrieval-only KB MCP server (hybrid search over the published kb revision).
    build:
      context: ..
      dockerfile: compose/app/Dockerfile
    image: servewell-app:s6
    command: ["python", "-m", "support_agent.mcp.knowledge"]
    environment:
      DATABASE_URL_KNOWLEDGE: ${DATABASE_URL_KNOWLEDGE:?}
      DB_HOST: postgres
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/servewell/protocol/openid-connect/certs
      OPA_URL: http://opa:8181
      LITELLM_BASE_URL: http://litellm:4000
      # The router's key for query embeddings (D66).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      MODEL_EMBED: ${MODEL_EMBED:-embed}
      EMBED_DIM: ${EMBED_DIM:-768}
      # Database 1: Langfuse uses database 0 of the same Valkey.
      VALKEY_URL_KNOWLEDGE: redis://knowledge:${VALKEY_PASSWORD_KNOWLEDGE:?}@valkey:6379/1
      KB_BUDGET_TOKENS: ${KB_BUDGET_TOKENS:-12000}
      LOG_DIR: /logs
      KNOWLEDGE_HOST: 0.0.0.0
      KNOWLEDGE_PORT: "8102"
    ports: ["127.0.0.1:8102:8102"]
    volumes:
      - ../logs:/logs
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      opa: {condition: service_healthy}
      valkey: {condition: service_healthy}
      litellm: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: {resources: {limits: {memory: 256m}}}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: {resources: {limits: {memory: 512m}}}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || curl -fsS http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 512m}}}
    restart: unless-stopped

volumes:
  pg_data:
  seaweed_data:
  clickhouse_data:
  clickhouse_logs:
  prometheus_data:
  grafana_data:
