# Port gateway (S8, D103): every service sits on the internal `core` network,
# which has no internet; this TCP forwarder is the only way in from the Mac and
# keeps every 127.0.0.1 port the same. It forwards fixed ports to fixed services
# and nothing else. Names resolve through Docker's DNS at run time, so a stopped
# service (Prometheus and Grafana with LEAN=1) never stops the gateway.
global
    log stdout format raw local0 warning

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    default-server init-addr last,libc,none resolvers docker

frontend health
    mode http
    bind :8404
    monitor-uri /health

listen postgres_5432
    bind :5432
    server postgres postgres:5432

listen seaweedfs_8333
    bind :8333
    server seaweedfs seaweedfs:8333

listen keycloak_8080
    bind :8080
    server keycloak keycloak:8080

listen opa_8181
    bind :8181
    server opa opa:8181

listen langfuse-web_3000
    bind :3000
    server langfuse-web langfuse-web:3000

listen litellm_4000
    bind :4000
    server litellm litellm:4000

listen it-data_8101
    bind :8101
    server it-data it-data:8101

listen knowledge_8102
    bind :8102
    server knowledge knowledge:8102

listen itsm-actions_8103
    bind :8103
    server itsm-actions itsm-actions:8103

listen prometheus_9090
    bind :9090
    server prometheus prometheus:9090

listen grafana_3001
    bind :3001
    server grafana grafana:3000
