# Service metrics (D9). Later sub-tasks add the app services as scrape jobs.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: opa
    metrics_path: /metrics
    static_configs:
      - targets: ["opa:8181"]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
