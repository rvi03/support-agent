[project]
name = "support-agent"
version = "0.1.0"
description = "L1 IT support agent POC for ServeWell's pilot stores"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "boto3>=1.40",
    "en-core-web-lg",
    "fastapi>=0.165.0",
    "httpx>=0.28",
    "langfuse>=3.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "mcp>=2.3,<3",
    "presidio-analyzer>=2.2.366",
    "prometheus-client>=0.21",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "spacy>=3.8.18",
    "structlog>=26.1.0",
    "tiktoken>=0.12",
    "uvicorn>=0.31",
    "valkey>=6.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.5",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pyjwt[crypto]>=2.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run subprocesses with fixed arguments.
"tests/**" = ["S101", "S603", "S607"]
# Platform CLI runs docker, colima and psql with fixed argument lists, found on PATH.
"src/support_agent/platform/__main__.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
# Untyped third-party modules get a named override with the reason, never a blanket one.

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:logging: pytest's own log capture would bypass the PII filter in reports.
addopts = "--strict-markers -ra -p no:logging"
markers = [
    "unit: fast tests with no running services",
    "integration: needs git, pre-commit or `make up` services",
    "e2e: full ticket runs through the API",
]

[tool.coverage.run]
source = ["support_agent"]
branch = true

[tool.coverage.report]
# Core modules from PRD quality bar 2; the list grows as modules land.
include = [
    "src/support_agent/common/config.py",
    "src/support_agent/common/logging.py",
    "src/support_agent/common/pii_filter.py",
    "src/support_agent/common/audit.py",
    "src/support_agent/platform/envfile.py",
    "src/support_agent/platform/realm.py",
    "src/support_agent/platform/models.py",
    "src/support_agent/platform/dbinit.py",
    "src/support_agent/platform/s3config.py",
    "src/support_agent/platform/mock_secrets.py",
    "src/support_agent/ingest/csv_clean.py",
    "src/support_agent/ingest/split.py",
    "src/support_agent/common/db.py",
    "src/support_agent/mcp/base/auth.py",
    "src/support_agent/mcp/base/errors.py",
    "src/support_agent/mcp/base/opa.py",
    "src/support_agent/mcp/base/server.py",
    "src/support_agent/mcp/it_data/logic.py",
    "src/support_agent/mcp/it_data/models.py",
    "src/support_agent/agent/tools.py",
    "src/support_agent/kb/clean.py",
    "src/support_agent/kb/chunk.py",
    "src/support_agent/kb/metadata.py",
    "src/support_agent/kb/conflicts.py",
    "src/support_agent/mcp/knowledge/tokenizer.py",
]
fail_under = 85
show_missing = true

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
